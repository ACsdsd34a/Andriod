name: Android Emulator

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to keep the emulator running (max 350)"
        default: "30"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub hard limit for hosted runners

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Prepare kernel modules for Android
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux || true
          lsmod | grep -i binder || true

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start tunnel and Android
        env:
          EMU_PASS: "uczUmsX9"
        run: |
          # --- 1. Cloudflare quick tunnel -> noVNC port ---
          setsid nohup cloudflared tunnel --no-autoupdate --url http://localhost:3000 > tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' tunnel.log | head -n1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then cat tunnel.log; echo "Tunnel failed"; exit 1; fi

          # --- 2. Start the Android emulator ---
          docker run -d --name android --privileged -p 127.0.0.1:5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=1280 androidboot.redroid_height=800 \
            androidboot.redroid_dpi=240 androidboot.redroid_fps=30

          # Selkies desktop (the same smooth streaming as the browser and Linux pages)
          docker run -d --name desktop --network host --shm-size=1gb --security-opt seccomp=unconfined \
            -e PUID=1000 -e PGID=1000 -e TZ=UTC \
            -e CUSTOM_USER=android -e PASSWORD="$EMU_PASS" \
            lscr.io/linuxserver/webtop:ubuntu-xfce

          # scrcpy shows the Android screen on that desktop
          SC_TAG=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/Genymobile/scrcpy/releases/latest)
          SC_TAG=${SC_TAG##*/}
          curl -fsSL -o scrcpy.tar.gz "https://github.com/Genymobile/scrcpy/releases/download/$SC_TAG/scrcpy-linux-x86_64-$SC_TAG.tar.gz"
          mkdir -p scrcpy-dir && tar -xzf scrcpy.tar.gz -C scrcpy-dir --strip-components=1
          docker cp scrcpy-dir desktop:/opt/scrcpy

          # Wait for Android to boot and accept ADB, then open it on the desktop
          for i in $(seq 1 90); do
            docker exec -u abc desktop /opt/scrcpy/adb connect localhost:5555 > /dev/null 2>&1 || true
            if docker exec -u abc desktop /opt/scrcpy/adb devices | grep -q "localhost:5555.*device"; then echo "Android connected"; break; fi
            sleep 3
          done
          docker exec -d -u abc -e DISPLAY=:1 -e ADB=/opt/scrcpy/adb -e SCRCPY_SERVER_PATH=/opt/scrcpy/scrcpy-server desktop /opt/scrcpy/scrcpy -s localhost:5555 --fullscreen --no-audio --render-driver=software

          # --- 3. Wait until the web page answers ---
          READY=""
          for i in $(seq 1 120); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            if [ "$CODE" != "000" ]; then READY=1; break; fi
            sleep 2
          done
          if [ -z "$READY" ]; then docker logs android | tail -n 50; echo "Emulator page did not start"; exit 1; fi

          # --- 4. Show ONLY the link on the run's summary page ---
          {
            echo "## Android is starting"
            echo ""
            echo "$URL"
            echo ""
            echo "Sign in as android with the password you chose. The Android screen opens on the desktop after a minute or two."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "OPEN ANDROID: $URL"

      - name: Keep alive
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          M=${MINUTES:-30}
          [ "$M" -gt 350 ] && M=350
          END=$(( $(date +%s) + M * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            if ! docker ps -q -f name=android | grep -q .; then echo "Emulator stopped"; docker logs android | tail -n 50; exit 1; fi
            docker exec desktop sh -c 'grep -qs scrcpy /proc/[0-9]*/comm' || { docker exec -u abc desktop /opt/scrcpy/adb connect localhost:5555 > /dev/null 2>&1; docker exec -d -u abc -e DISPLAY=:1 -e ADB=/opt/scrcpy/adb -e SCRCPY_SERVER_PATH=/opt/scrcpy/scrcpy-server desktop /opt/scrcpy/scrcpy -s localhost:5555 --fullscreen --no-audio --render-driver=software; } || true
            echo "[$(date)] Android active - cancel the workflow to stop"
            sleep 60
          done
          docker stop android
