name: Android Emulator

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to keep the emulator running (max 350)"
        default: "30"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub hard limit for hosted runners

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start tunnel and Android
        env:
          EMU_PASS: "uczUmsX9"
        run: |
          # --- 1. Cloudflare quick tunnel -> noVNC port ---
          setsid nohup cloudflared tunnel --no-autoupdate --url http://localhost:6080 > tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' tunnel.log | head -n1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then cat tunnel.log; echo "Tunnel failed"; exit 1; fi

          # --- 2. Start the Android emulator ---
          docker run -d --name android -p 6080:6080 \
            --device /dev/kvm \
            -e EMULATOR_DEVICE="Samsung Galaxy S10" \
            -e WEB_VNC=true \
            -e VNC_PASSWORD="$EMU_PASS" \
            budtmo/docker-android:emulator_9.0

          # --- 3. Wait until the web page answers ---
          READY=""
          for i in $(seq 1 120); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:6080/ || true)
            if [ "$CODE" != "000" ]; then READY=1; break; fi
            sleep 2
          done
          if [ -z "$READY" ]; then docker logs android | tail -n 50; echo "Emulator page did not start"; exit 1; fi

          # --- 4. Show ONLY the link on the run's summary page ---
          {
            echo "## Android is starting"
            echo ""
            echo "$URL/?autoconnect=true&resize=scale"
            echo ""
            echo "Enter your password when asked. The phone needs a few more minutes to boot."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "OPEN ANDROID: $URL/?autoconnect=true&resize=scale"

      - name: Keep alive
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          M=${MINUTES:-30}
          [ "$M" -gt 350 ] && M=350
          END=$(( $(date +%s) + M * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            if ! docker ps -q -f name=android | grep -q .; then echo "Emulator stopped"; docker logs android | tail -n 50; exit 1; fi
            :
            echo "[$(date)] Emulator status: $(docker exec android cat device_status 2>/dev/null || echo unknown) - cancel the workflow to stop"
            sleep 60
          done
          docker stop android
